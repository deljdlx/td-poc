<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower Defense POC - ES6 Modules + MVC Architecture</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/cell.css">
    <link rel="stylesheet" href="assets/css/path.css">
    <link rel="stylesheet" href="assets/css/enemy.css">
    <link rel="stylesheet" href="assets/css/tower-range.css">
    <link rel="stylesheet" href="assets/css/popup.css">
    <link rel="stylesheet" href="assets/css/tower-stats.css">
    <link rel="stylesheet" href="assets/css/debug-panel.css">
</head>
<body>
    <!-- Canvas Layer (fullscreen, non-interactif, overlay) -->
    <canvas id="canvas-layer"></canvas>
    
    <!-- Path Layer (overlay pour les chemins statiques) -->
    <div id="path-layer"></div>
    
    <!-- Enemy Layer (overlay pour les ennemis en DOM) -->
    <div id="enemy-layer"></div>
    
    <!-- Layout Structure -->
    <header class="game-header">
        <h1 id="player-gold">💰 Gold: <span id="gold-amount">0</span></h1>
    </header>
    
    <main class="game-main">
        <aside class="sidebar-left">
            <!-- Sidebar gauche -->
        </aside>
        
        <div class="game-area">
            <!-- Grid Container (DOM interactif) -->
            <div id="grid-container"></div>
        </div>
        
        <aside class="sidebar-right">
            <!-- Sidebar droite -->
        </aside>
    </main>
    
    <footer class="game-footer">
        <button id="player-info-btn" class="debug-btn" title="Player Info (Debug)">
            👤 Player Info
        </button>
        <button id="debug-panel-toggle-btn" class="debug-btn" title="Toggle Debug Panel">
            🔍 Debug Panel
        </button>
    </footer>
    
    <!-- Debug Panel -->
    <div id="debug-panel" class="debug-panel">
        <div class="debug-panel-header">
            <span class="debug-panel-title">🔍 Debug</span>
        </div>
        <div class="debug-panel-content">
            <div class="debug-section">
                <div class="debug-section-title">Log Level</div>
                <select id="debug-log-level" class="debug-select">
                    <option value="0">ALL</option>
                    <option value="1" selected>DEBUG</option>
                    <option value="2">INFO</option>
                    <option value="3">WARN</option>
                    <option value="4">ERROR</option>
                    <option value="5">NONE</option>
                </select>
            </div>
            <div class="debug-section">
                <div class="debug-section-title">Quick Actions</div>
                <button id="debug-clear-console" class="debug-button">Clear Console</button>
            </div>
            <div class="debug-section">
                <div class="debug-section-title">Info</div>
                <div class="debug-info">
                    <div class="debug-info-item">
                        <span class="debug-info-label">FPS:</span>
                        <span class="debug-info-value" id="debug-fps">--</span>
                    </div>
                    <div class="debug-info-item">
                        <span class="debug-info-label">Entities:</span>
                        <span class="debug-info-value" id="debug-entities">--</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Application - ES6 Module -->
    <script type="module" src="assets/js/main.js"></script>
</body>
</html>
