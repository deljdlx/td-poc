<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POC - Grid DOM + Canvas Layer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Canvas Layer (non-interactif, overlay) -->
    <canvas id="canvas-layer"></canvas>
    
    <!-- DOM Grid (interactif) -->
    <div id="grid-container"></div>
    
    <!-- Info Panel -->
    <div id="info-panel">
        <h2>Interactive Grid POC</h2>
        <p>Click on cells to toggle selection</p>
        <p>Canvas layer draws connections between selected cells</p>
        <div id="stats">
            <span>Selected: <strong id="selected-count">0</strong></span>
        </div>
    </div>
    
    <!-- Application - ES6 Module -->
    <script type="module" src="assets/js/main.js"></script>
</body>
</html>
