<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POC - Grid DOM + Canvas Layer</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Canvas Layer (non-interactif, overlay) -->
    <canvas id="canvas-layer"></canvas>
    
    <!-- DOM Grid (interactif) -->
    <div id="grid-container"></div>
    
    <!-- Info Panel -->
    <div id="info-panel">
        <h2>Interactive Grid POC</h2>
        <p>Click on cells to toggle selection</p>
        <p>Canvas layer draws connections between selected cells</p>
        <div id="stats">
            <span>Selected: <strong id="selected-count">0</strong></span>
        </div>
    </div>
    
    <!-- Utils -->
    <script src="assets/js/utils/DIContainer.js"></script>
    <script src="assets/js/utils/Debug.js"></script>
    <script src="assets/js/utils/CoordinateSystem.js"></script>
    <script src="assets/js/utils/GameClock.js"></script>
    
    <!-- Bootstrap DI -->
    <script src="assets/js/bootstrap.js"></script>
    
    <!-- FX - Particles -->
    <script src="assets/js/fx/particles/Particle.js"></script>
    <script src="assets/js/fx/particles/CircleParticle.js"></script>
    <script src="assets/js/fx/particles/SquareParticle.js"></script>
    <script src="assets/js/fx/particles/StarParticle.js"></script>
    <script src="assets/js/fx/particles/TriangleParticle.js"></script>
    <script src="assets/js/fx/particles/DiamondParticle.js"></script>
    
    <!-- FX - Effects -->
    <script src="assets/js/fx/FireworkEffect.js"></script>
    
    <!-- Models -->
    <script src="assets/js/models/Entity.js"></script>
    <script src="assets/js/models/EntityManager.js"></script>
    <script src="assets/js/models/Missile.js"></script>
    <script src="assets/js/models/Cell.js"></script>
    <script src="assets/js/models/GridModel.js"></script>
    
    <!-- Views -->
    <script src="assets/js/views/GridView.js"></script>
    <script src="assets/js/views/CanvasView.js"></script>
    <script src="assets/js/views/InfoView.js"></script>
    
    <!-- Controllers -->
    <script src="assets/js/controllers/AppController.js"></script>
    
    <!-- Main -->
    <script src="assets/js/main.js"></script>
</body>
</html>
