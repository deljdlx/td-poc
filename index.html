<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower Defense POC - ES6 Modules + MVC Architecture</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/cell.css">
    <link rel="stylesheet" href="assets/css/path.css">
    <link rel="stylesheet" href="assets/css/enemy.css">
    <link rel="stylesheet" href="assets/css/tower-range.css">
</head>
<body>
    <!-- Canvas Layer (fullscreen, non-interactif, overlay) -->
    <canvas id="canvas-layer"></canvas>
    
    <!-- Path Layer (overlay pour les chemins statiques) -->
    <div id="path-layer"></div>
    
    <!-- Enemy Layer (overlay pour les ennemis en DOM) -->
    <div id="enemy-layer"></div>
    
    <!-- Layout Structure -->
    <header class="game-header">
        <h1>🗼 Tower Defense POC</h1>
    </header>
    
    <main class="game-main">
        <aside class="sidebar-left">
            <!-- Sidebar gauche -->
        </aside>
        
        <div class="game-area">
            <!-- Grid Container (DOM interactif) -->
            <div id="grid-container"></div>
        </div>
        
        <aside class="sidebar-right">
            <!-- Sidebar droite -->
        </aside>
    </main>
    
    <footer class="game-footer">
        <p>Tower Defense POC - ES6 Modules + MVC Architecture</p>
    </footer>
    
    <!-- Application - ES6 Module -->
    <script type="module" src="assets/js/main.js"></script>
</body>
</html>
